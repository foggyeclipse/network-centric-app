global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ["user-service:5000"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:5001"]

  - job_name: order-service
    static_configs:
      - targets: ["order-service:5002"]
